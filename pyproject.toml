[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-agent-control"
version = "0.1.0"
description = "Private Telegram control for Codex, Claude Code, and headless CLI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
telegram-agent-control = "agent_control.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_control*"]
